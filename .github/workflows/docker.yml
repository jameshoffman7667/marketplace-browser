name: build-and-push

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check version consistency
        run: |
          v=$(tr -d '[:space:]' < VERSION)
          m=$(python3 -c "import json;print(json.load(open('extension/manifest.json'))['version'])")
          [ "$v" = "$m" ] || { echo "VERSION ($v) and extension manifest ($m) differ"; exit 1; }
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "Tag $GITHUB_REF_NAME does not match VERSION $v"; exit 1; }
          fi
          label="v$(echo "$v" | cut -d. -f1,2)"
          grep -qE "^## $label( |$)" CHANGELOG.md || { echo "CHANGELOG.md has no '## $label' entry"; exit 1; }
          [ -f "docs/functional-spec-$label.md" ] || { echo "missing docs/functional-spec-$label.md"; exit 1; }
          [ -f "docs/releases/$label-commit-message.txt" ] || { echo "missing docs/releases/$label-commit-message.txt"; exit 1; }

      - name: Smoke test (server, alerts, ingest, location)
        run: python3 tests/smoke.py

      - name: Apify source test (fake Apify API)
        run: python3 tests/apify_test.py

  docker:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Compute version
        id: ver
        run: |
          base=$(tr -d '[:space:]' < VERSION)
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then v="${GITHUB_REF_NAME#v}"; else v="${base}-dev.${GITHUB_SHA::7}"; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/classifieds-tracker
          tags: |
            type=edge,branch=main
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.ver.outputs.version }}
            VCS_REF=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  extension:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write   # attach the zip to the GitHub release on tags
    steps:
      - uses: actions/checkout@v4

      - name: Package extension
        run: |
          v=$(tr -d '[:space:]' < VERSION)
          mkdir -p dist
          (cd extension && zip -r -q "../dist/classifieds-tracker-extension-${v}.zip" .)

      - uses: actions/upload-artifact@v4
        with:
          name: extension
          path: dist/*.zip

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
