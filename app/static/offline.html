<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1f6f5c">
<title>Offline - Marketplace Browser</title>
<link rel="icon" href="/icons/favicon-32.png">
<style>
:root{--bg:#f6f5f1;--ink:#1d2321;--mute:#66706b;--acc:#1f6f5c;--acc-ink:#fff}
@media (prefers-color-scheme:dark){:root{--bg:#121513;--ink:#e8ece9;--mute:#98a39d;--acc:#4fb79c;--acc-ink:#0b1210}}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:16px}
main{max-width:420px;text-align:center}
img{width:72px;height:72px;border-radius:16px}
p{color:var(--mute)}
button{min-height:44px;padding:0 22px;border:0;border-radius:10px;background:var(--acc);color:var(--acc-ink);font:inherit;font-weight:600;cursor:pointer}
</style>
</head>
<body>
<main>
  <img src="/icons/icon-192.png" alt="">
  <h1>You are offline</h1>
  <p>Marketplace Browser needs a connection to your server to show listings. Check your network or VPN, then try again.</p>
  <button type="button" onclick="location.reload()">Try again</button>
</main>
</body>
</html>
