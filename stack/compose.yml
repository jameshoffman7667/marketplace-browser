# Classifieds Tracker: Dockhand stack (also valid for plain `docker compose up -d`).
#
# In Dockhand: Stacks > Create (paste this file) or add this repo as a Git stack and point it at stack/compose.yml.
# Set the environment variables below in the stack's variables (see stack/.env.example).
name: classifieds-tracker

services:
  tracker:
    image: ${TRACKER_IMAGE:?Set TRACKER_IMAGE, for example yourdockerhubuser/classifieds-tracker:0.3.0}
    container_name: classifieds-tracker
    restart: unless-stopped
    ports:
      - "${TRACKER_PORT:-3501}:3501"
    environment:
      APP_PASSWORD: ${APP_PASSWORD:?Set APP_PASSWORD, the password for the web UI}
      INGEST_TOKEN: ${INGEST_TOKEN:-}          # optional; generated and shown in Settings when empty
      TZ: ${TZ:-America/Toronto}               # quiet hours and digests use this zone
      MIN_POLL_MINUTES: ${MIN_POLL_MINUTES:-5}
    volumes:
      - tracker-data:/data                     # SQLite database; a named volume avoids host path and permission issues

volumes:
  tracker-data:
