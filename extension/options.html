<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Classifieds Tracker options</title>
<style>
:root{--bg:#f6f5f1;--card:#fff;--ink:#1d2321;--mute:#66706b;--line:#dcdad2;--acc:#1f6f5c;--bad:#b3261e}
@media (prefers-color-scheme:dark){:root{--bg:#121513;--card:#1b1f1d;--ink:#e8ece9;--mute:#98a39d;--line:#2b312e;--acc:#4fb79c;--bad:#f2867e}}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,sans-serif}
main{max-width:560px;margin:0 auto;padding:24px 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}
label{display:block;margin:12px 0 4px;color:var(--mute);font-size:13px}
label.inline{display:flex;gap:8px;align-items:center;color:var(--ink);font-size:15px}
input[type=text],input[type=url],input[type=password],input[type=number]{width:100%;box-sizing:border-box;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}
button{padding:8px 16px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;cursor:pointer;margin-right:8px}
button.pri{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
.mute{color:var(--mute);font-size:13px} .bad{color:var(--bad)} .ok{color:var(--acc)}
</style>
</head>
<body>
<main>
<h1>Classifieds Tracker Companion</h1>
<div class="card">
  <label for="url">Server URL</label>
  <input id="url" type="url" placeholder="http://192.168.1.20:8080">
  <label for="tok">Ingest token (Settings, Browser extension / API, in the tracker)</label>
  <input id="tok" type="password" autocomplete="off">
  <div style="margin-top:14px"><button class="pri" id="save">Save</button><button id="test">Test connection</button></div>
  <div id="msg" class="mute" style="margin-top:8px"></div>
</div>
<div class="card">
  <label class="inline"><input type="checkbox" id="auto"> Run my searches automatically in the background</label>
  <label for="int">Every (minutes, at least 15)</label>
  <input id="int" type="number" min="15" value="30">
  <label for="max">Most pages to open per run</label>
  <input id="max" type="number" min="1" max="30" value="10">
  <label class="inline" style="margin-top:12px"><input type="checkbox" id="fg"> Open search pages in the foreground (more reliable lazy loading, but takes focus)</label>
  <div class="mute" style="margin-top:10px">Pages open one at a time in your own signed-in browser with random pauses between them. Keep the interval modest: frequent automated browsing can get a Facebook account restricted.</div>
</div>
</main>
<script src="options.js"></script>
</body>
</html>
